name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Cross-Platform Builds"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout bumped main branch
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage web assets
        run: |
          mkdir -p pages
          cp -r index.html site.webmanifest .nojekyll js themes vendor firmware Calibration endmilltest android-chrome-192x192.png android-chrome-512x512.png apple-touch-icon.png favicon-16x16.png favicon-32x32.png splash.png favicon.ico ooznestlogo.gcode chart.umd.js.map machine.json pages/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
